name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pyinstaller pyside6 requests openpyxl

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed --name DownloadPicFromExcel --collect-all PySide6 download_excel_images.py

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\DownloadPicFromExcel.exe -DestinationPath dist\DownloadPicFromExcel-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadPicFromExcel-Windows
          path: dist/DownloadPicFromExcel-Windows.zip
